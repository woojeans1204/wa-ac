name: Refresh Codeforces data

on:
  schedule:
    - cron: "7,37 * * * *"
    - cron: "17 */6 * * *"
    - cron: "27 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codeforces-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch newly finished contests
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7,37 * * * *'
        run: node scripts/backfill-codeforces-contests.mjs --skip-ratings --limit 20

      - name: Refresh problem ratings
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *'
        run: node scripts/backfill-codeforces-contests.mjs --ratings-only

      - name: Refresh random-player handles
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '27 3 * * *'
        run: node scripts/refresh-codeforces-random-handles.mjs

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/codeforces-contest-problems.json app/data/codeforces-random-handles.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Refresh Codeforces data"
          git push origin HEAD:main
